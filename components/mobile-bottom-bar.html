<!--
  Reusable smartphone bottom navigation / action bar.

  Copy the CSS, nav markup, and script into src/index.template.html, then adapt
  labels, icons, targets, and action handlers to the application. The component
  is hidden above 600px by default and remains dependency-free/offline.
-->
<style>
  :root {
    --app-mobile-bottom-bar-height: 74px;
    --app-mobile-bottom-accent: var(--accent, #16624f);
    --app-mobile-bottom-accent-soft: var(--accent-soft, #e1f0ea);
    --app-mobile-bottom-muted: var(--muted, #6b6f69);
    --app-mobile-bottom-line: var(--line, #dadbd6);
  }

  .app-mobile-bottom-bar {
    display: none;
  }

  @media (max-width: 600px) {
    body.has-mobile-bottom-bar {
      padding-bottom: calc(var(--app-mobile-bottom-bar-height) + env(safe-area-inset-bottom));
    }

    .app-mobile-bottom-bar {
      position: fixed;
      z-index: 80;
      left: 0;
      right: 0;
      bottom: 0;
      display: grid;
      grid-template-columns: repeat(var(--app-mobile-bottom-items, 4), minmax(0, 1fr));
      gap: 4px;
      padding: 6px 10px calc(6px + env(safe-area-inset-bottom));
      border-top: 1px solid color-mix(in srgb, var(--app-mobile-bottom-line) 82%, transparent);
      background: rgba(255, 255, 255, .94);
      box-shadow: 0 -8px 24px rgba(20, 22, 20, .06);
      backdrop-filter: blur(18px) saturate(1.35);
    }

    .app-mobile-bottom-item {
      position: relative;
      min-width: 0;
      min-height: 54px;
      padding: 5px 4px;
      border: 0;
      border-radius: 12px;
      background: transparent;
      color: var(--app-mobile-bottom-muted);
      display: grid;
      place-items: center;
      align-content: center;
      gap: 3px;
      font: inherit;
      font-size: 10px;
      font-weight: 750;
      line-height: 1.15;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .app-mobile-bottom-item svg {
      width: 21px;
      height: 21px;
    }

    .app-mobile-bottom-item span {
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .app-mobile-bottom-item:hover,
    .app-mobile-bottom-item:focus-visible,
    .app-mobile-bottom-item.is-active,
    .app-mobile-bottom-item[aria-current="page"] {
      color: var(--app-mobile-bottom-accent);
      background: var(--app-mobile-bottom-accent-soft);
    }

    .app-mobile-bottom-item.primary:not(:disabled) {
      color: var(--app-mobile-bottom-accent);
      background: var(--app-mobile-bottom-accent-soft);
    }

    .app-mobile-bottom-item:disabled {
      opacity: .36;
      cursor: default;
      background: transparent;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .app-mobile-bottom-item {
      scroll-behavior: auto;
    }
  }
</style>

<!--
  Example with two section links and two workflow actions.
  Set --app-mobile-bottom-items to 3 or 5 when the number of items changes.
-->
<nav
  class="app-mobile-bottom-bar"
  id="appMobileBottomBar"
  style="--app-mobile-bottom-items: 4"
  aria-label="Mobile actions"
>
  <button class="app-mobile-bottom-item is-active" type="button" data-mobile-key="source" data-mobile-target="sourceSection" aria-current="page">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16v12H4z"/><path d="m8 7 2-3h4l2 3"/><circle cx="12" cy="13" r="3"/></svg>
    <span>Source</span>
  </button>
  <button class="app-mobile-bottom-item" type="button" data-mobile-key="edit" data-mobile-target="editSection">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 6h14M5 12h14M5 18h14"/><circle cx="9" cy="6" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="11" cy="18" r="2"/></svg>
    <span>Edit</span>
  </button>
  <button class="app-mobile-bottom-item primary" type="button" data-mobile-key="run" data-mobile-action="run">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m8 5 11 7-11 7V5Z"/></svg>
    <span>Run</span>
  </button>
  <button class="app-mobile-bottom-item" type="button" data-mobile-key="save" data-mobile-action="save" disabled>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h12l2 2v14H5z"/><path d="M8 4v6h8V4M8 16h8"/></svg>
    <span>Save</span>
  </button>
</nav>

<script>
  (() => {
    'use strict';

    function mountMobileBottomBar(root, options = {}) {
      if (!(root instanceof HTMLElement)) throw new TypeError('A mobile bottom bar root element is required.');

      const actionHandlers = options.actions || {};
      const reduceMotion = window.matchMedia?.('(prefers-reduced-motion: reduce)').matches ?? false;
      const buttons = Array.from(root.querySelectorAll('.app-mobile-bottom-item'));
      let observer = null;

      function buttonByKey(key) {
        return buttons.find(button => button.dataset.mobileKey === key) || null;
      }

      function setActive(key) {
        for (const button of buttons) {
          const active = button.dataset.mobileKey === key;
          button.classList.toggle('is-active', active);
          if (button.dataset.mobileTarget) {
            if (active) button.setAttribute('aria-current', 'page');
            else button.removeAttribute('aria-current');
          }
        }
      }

      function setEnabled(key, enabled) {
        const button = buttonByKey(key);
        if (!button) return false;
        button.disabled = !enabled;
        return true;
      }

      function clickHandler(event) {
        const button = event.target.closest('.app-mobile-bottom-item');
        if (!button || !root.contains(button) || button.disabled) return;

        const targetId = button.dataset.mobileTarget;
        if (targetId) {
          const target = document.getElementById(targetId);
          if (target) {
            target.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'start' });
            setActive(button.dataset.mobileKey || targetId);
          }
        }

        const actionName = button.dataset.mobileAction;
        const handler = actionName ? actionHandlers[actionName] : null;
        if (typeof handler === 'function') handler({ button, event });
      }

      root.addEventListener('click', clickHandler);

      const targetButtons = buttons.filter(button => button.dataset.mobileTarget);
      if (options.observeSections !== false && targetButtons.length && 'IntersectionObserver' in window) {
        const targets = targetButtons
          .map(button => ({ button, target: document.getElementById(button.dataset.mobileTarget) }))
          .filter(entry => entry.target);

        observer = new IntersectionObserver(entries => {
          const visible = entries
            .filter(entry => entry.isIntersecting)
            .sort((a, b) => b.intersectionRatio - a.intersectionRatio)[0];
          if (!visible) return;
          const match = targets.find(entry => entry.target === visible.target);
          if (match) setActive(match.button.dataset.mobileKey || match.button.dataset.mobileTarget);
        }, { rootMargin: '-30% 0px -55% 0px', threshold: [0, .01, .25, .5] });

        for (const entry of targets) observer.observe(entry.target);
      }

      return Object.freeze({
        setActive,
        setEnabled,
        button: buttonByKey,
        destroy() {
          observer?.disconnect();
          root.removeEventListener('click', clickHandler);
        }
      });
    }

    window.AppMobileBottomBar = Object.freeze({ mount: mountMobileBottomBar });
  })();
</script>
